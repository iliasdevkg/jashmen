# /etc/nginx/sites-available/jashmenstudio.com
#
# Plain HTTP on port 80 — no SSL here on purpose. TLS is terminated
# upstream (the network's own proxy, outside this VPS), which forwards
# to this server's port 80 over plain HTTP:
#
#   Client → HTTPS(443) → upstream proxy → HTTP(80) → this nginx → app
#
# So: no certbot, no 443 listener, no https redirect on this box. Adding
# any of those here would collide with the upstream proxy — see DEPLOY.md.
#
# The app itself runs in Docker bound to 127.0.0.1:3030 (docker-compose.yml),
# unreachable from outside except through this nginx.

server {
    listen 80;
    server_name jashmenstudio.com;

    # Admin panel uploads lesson media (multer caps a single file at 25MB in
    # admin-api/uploads.js) — keep nginx's limit above that so the app's own
    # error message is what the user sees, not nginx's bare 413.
    client_max_body_size 100M;

    location / {
        proxy_pass http://127.0.0.1:3030;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Hardcoded https, not $scheme: the request reached this box over
        # plain HTTP, but the client's original request to the upstream
        # proxy was HTTPS, and that's what the app should see.
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
