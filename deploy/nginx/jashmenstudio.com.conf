# /etc/nginx/sites-available/jashmenstudio.com
#
# Single public entrypoint for jashmenstudio.com.
#
#   Client → HTTPS(443) → agay's Nginx Proxy Manager (public 178.217.174.176)
#          → HTTP(80)   → this nginx (192.168.100.87)
#          → proxy_pass → the containers, each on its own 127.0.0.1 port
#
# NO SSL here on purpose: TLS terminates upstream at agay's NPM. No certbot,
# no 443 listener, no https redirect — adding any of those collides with the
# upstream proxy. See DEPLOY.md.
#
# ── ADDING A NEW CONTAINER ────────────────────────────────────────────────
# Per agay: never publish a container's port to the network, and never add a
# second reverse proxy. Bind the container to 127.0.0.1:<port> in
# docker-compose.yml, then add ONE location block here:
#
#     location /myservice/ {
#         proxy_pass http://127.0.0.1:<port>;
#         include snippets/jashmen-proxy.conf;
#     }
#
# Then: nginx -t && systemctl reload nginx
#
# Two things to get right when you copy that:
#   - NO trailing slash on proxy_pass. `http://127.0.0.1:3030` forwards the
#     full original URI; `http://127.0.0.1:3030/` would strip the location
#     prefix, so the app would see `/` instead of `/admin/api/health`.
#   - nginx picks the LONGEST matching prefix, not the first one written, so
#     the order of these blocks doesn't matter — /admin/api/ wins over
#     /admin/ which wins over / regardless.

server {
    listen 80;
    server_name jashmenstudio.com;

    # Admin panel uploads lesson media (multer caps a single file at 25MB in
    # admin-api/uploads.js) — keep nginx's limit above that so the app's own
    # error message is what the user sees, not nginx's bare 413.
    client_max_body_size 100M;

    # ── API ───────────────────────────────────────────────────────────────
    # Backend JSON API + uploaded media (admin-api/, Express).
    location /admin/api/ {
        proxy_pass http://127.0.0.1:3030;
        include snippets/jashmen-proxy.conf;
    }

    # ── Admin panel ───────────────────────────────────────────────────────
    # Built SPA from admin-src/, currently served by the same Express process
    # out of dist/admin/. Split out as its own block so it can be pointed at
    # a separate container later without touching anything else.
    location /admin/ {
        proxy_pass http://127.0.0.1:3030;
        include snippets/jashmen-proxy.conf;
    }

    # `/admin` with no trailing slash does NOT match the block above — prefix
    # matching would send it to `/` instead. Harmless today (both proxy to
    # the same process, which 301s to /admin/), but it would silently route
    # to the wrong container the day the admin panel moves. Pin it now.
    location = /admin {
        proxy_pass http://127.0.0.1:3030;
        include snippets/jashmen-proxy.conf;
    }

    # ── Frontend ──────────────────────────────────────────────────────────
    # The public React SPA (dist/), plus its static assets.
    location / {
        proxy_pass http://127.0.0.1:3030;
        include snippets/jashmen-proxy.conf;
    }
}
