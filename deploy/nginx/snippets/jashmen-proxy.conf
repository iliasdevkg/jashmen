# /etc/nginx/snippets/jashmen-proxy.conf
#
# Shared proxy headers for every location block in jashmenstudio.com.conf.
# Kept in one file so adding a new container never means re-typing (or
# forgetting) one of these — each location block is then just:
#
#     location /whatever/ {
#         proxy_pass http://127.0.0.1:<port>;
#         include snippets/jashmen-proxy.conf;
#     }

proxy_http_version 1.1;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection "upgrade";
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

# Hardcoded https, not $scheme: the request reached this box over plain HTTP
# from the upstream proxy, but the client's original request was HTTPS, and
# that is what the app should see.
proxy_set_header X-Forwarded-Proto https;

proxy_read_timeout 600s;
proxy_send_timeout 600s;
