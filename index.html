<!doctype html>
<html lang="ky">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

    <!-- `/` is the business site (src/pages/BusinessPage.jsx) — the page a
         partner lands on, with real crawlable copy about what JashMen offers
         an organisation. The student-facing landing moved to /app when the
         business site took the root; both are in public/sitemap.xml.
         Because this is a single-page app, one <head> serves every route, so
         it describes the front door and each page sets its own document
         title on mount. Keep this in agreement with the business copy
         (src/components/business/copy.js) — neither is admin-editable. -->
    <!-- Google Search Console ownership proof for the https://jashmenstudio.com
         URL-prefix property. Must stay in the served HTML — removing it
         un-verifies the property and cuts off indexing requests/coverage
         reports. -->
    <meta name="google-site-verification" content="Bc58ATbmqyjfuP2bYl9-nKXUJovM2MW-jsTnpnvvzk4" />

    <title>Jashmen — финансовое образование, которое меняет поведение</title>
    <meta name="description" content="Jashmen помогает организациям вовлекать свою аудиторию в финансовое обучение через игру, создавать совместные модули и интегрировать опыт в свои платформы. Сезон на одном кампусе — восемь недель от старта до отчёта." />
    <link rel="canonical" href="https://jashmenstudio.com/" />

    <!-- Landing-page typography (src/components/landing/*). Onest sets the
         headings, Inter the prose. Both families carry cyrillic-ext, which is
         what ө / ү / ң need — the default `cyrillic` subset does not include
         them, and the browser would fall back mid-word. Onest was drawn with
         Cyrillic as a first-class script rather than an afterthought, which
         is why the Kyrgyz headlines no longer need uppercasing to look
         deliberate. `display=swap` keeps the page readable in the system
         stack while these load; preconnect shaves the extra DNS+TLS round
         trip Google Fonts otherwise costs. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Onest:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap"
    />

    <link rel="icon" href="/logo.png" type="image/png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="JashMen" />

    <!-- Open Graph — what WhatsApp/Telegram/Instagram show when the link is shared -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="JashMen Studio" />
    <meta property="og:url" content="https://jashmenstudio.com/" />
    <meta property="og:title" content="JashMen Studio — каржы сабаттуулугун оюн аркылуу үйрөн" />
    <meta property="og:description" content="Акча, каржы жана инвестиция боюнча кыргызча окуу колдонмосу. Кыска сабактар, оюн түрүндөгү тапшырмалар, күнүмдүк серия жана лига." />
    <meta property="og:image" content="https://jashmenstudio.com/logo.png" />
    <meta property="og:image:width" content="1254" />
    <meta property="og:image:height" content="1254" />
    <meta property="og:locale" content="ky_KG" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="JashMen Studio — каржы сабаттуулугун оюн аркылуу үйрөн" />
    <meta name="twitter:description" content="Акча, каржы жана инвестиция боюнча кыргызча окуу колдонмосу." />
    <meta name="twitter:image" content="https://jashmenstudio.com/logo.png" />

    <!-- Structured data. sameAs is what ties this domain to the already
         well-ranked @jashmen.studio Instagram account, which is the strongest
         signal we have for the brand query "jashmenstudio". alternateName
         carries the spellings people actually type. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://jashmenstudio.com/#organization",
          "name": "JashMen Studio",
          "alternateName": ["JashMen", "jashmenstudio", "jashmen.studio", "ЖашМен"],
          "url": "https://jashmenstudio.com/",
          "logo": {
            "@type": "ImageObject",
            "url": "https://jashmenstudio.com/logo.png",
            "width": 1254,
            "height": 1254
          },
          "description": "Кыргыз тилинде каржы сабаттуулугу боюнча билим берүүчү долбоор.",
          "email": "jashmenstudio@gmail.com",
          "sameAs": [
            "https://www.instagram.com/jashmen.studio/"
          ]
        },
        {
          "@type": "WebSite",
          "@id": "https://jashmenstudio.com/#website",
          "url": "https://jashmenstudio.com/",
          "name": "JashMen Studio",
          "inLanguage": "ky",
          "publisher": { "@id": "https://jashmenstudio.com/#organization" }
        },
        {
          "@type": "WebApplication",
          "name": "JashMen",
          "url": "https://jashmenstudio.com/",
          "applicationCategory": "EducationalApplication",
          "operatingSystem": "Web",
          "inLanguage": "ky",
          "description": "Акча, каржы жана инвестиция боюнча кыргызча окуу колдонмосу — кыска сабактар, оюн түрүндөгү тапшырмалар, күнүмдүк серия жана лига.",
          "publisher": { "@id": "https://jashmenstudio.com/#organization" },
          "offers": {
            "@type": "Offer",
            "price": "0",
            "priceCurrency": "KGS"
          }
        }
      ]
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
