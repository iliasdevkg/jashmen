services:
  # JashMen backend — serves the built frontend (dist/) and the /admin/api
  # Express API from a single Node process.
  #
  # Bound to 127.0.0.1 only: the public entrypoint is the host's own nginx
  # (installed natively, not in Docker — see DEPLOY.md), which terminates
  # SSL on 443 and proxy_passes to 127.0.0.1:3030. Publishing this port
  # publicly would expose the app over plain HTTP, bypassing that nginx.
  jashmen:
    build: .
    restart: unless-stopped
    env_file:
      - ./admin-api/.env.production
    environment:
      - PORT=3030
      - NODE_ENV=production
    volumes:
      - jashmen_data:/app/admin-api/data
    ports:
      - "127.0.0.1:3030:3030"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3030/admin/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  jashmen_data:
